---
# yamllint disable rule:line-length
name: rake
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  rake:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        ruby: [3.3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update --yes
          sudo apt-get install --yes ghostscript imagemagick
          sudo sed -i '/pattern="PDF"/d' /etc/ImageMagick-6/policy.xml
      - uses: zauguin/install-texlive@v4.5.0
        with:
          packages: >
            amsfonts amsmath anyfontsize auxhook babel babel-english
            babel-russian biber biblatex bigintcalc bitset bookmark
            catchfile cm-super csquotes cyrillic datetime dejavu
            epstopdf-pkg etexcmds etoolbox everypage fancyvrb ffcode
            figureversions float fmtcount fontaxes fvextra geometry
            gettitlestring graphics graphics-cfg graphics-def grfext
            href-ul hycolor hypdoc hyperref iftex infwarerr intcalc
            kvdefinekeys kvoptions kvsetkeys l3kernel
            l3packages latex latex-bin latex2pydata latexconfig
            lh libertine lineno lm logreq ltxcmds makecell
            mdframed merriweather microtype minted mptopdf needspace
            newtx pdfescape pdftexcmds pgf pgfopts pgfplots refcount
            rerunfilecheck scheme-basic setspace silence stringenc
            textpos tools uniquecounter upquote url verbatimcopy xcolor
            xetex xkeyval zref
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle config set --global path "$(pwd)/vendor/bundle"
      - run: bundle install --no-color
      - run: bundle exec rake
